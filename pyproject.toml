[project]
name = "voice-match"
version = "0.4.0"
description = "Wyoming speech-to-text proxy for Home Assistant: trims background speech and recognises who is speaking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["wyoming==1.11.0", "numpy>=1.26", "onnxruntime>=1.18", "kaldi-native-fbank>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
voice-match = "voice_match.__main__:run"

[tool.setuptools]
packages = ["voice_match"]

[tool.setuptools.package-data]
voice_match = ["models/*.onnx", "models/SILERO_VAD_LICENSE", "models/WESPEAKER_NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
