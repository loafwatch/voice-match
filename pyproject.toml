[project]
name = "voice-match"
version = "0.1.0"
description = "Wyoming speech-to-text proxy for Home Assistant: trims background speech and recognises who is speaking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["wyoming==1.11.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
voice-match = "voice_match.__main__:run"

[tool.setuptools]
packages = ["voice_match"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
