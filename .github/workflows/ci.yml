name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Generic leak patterns only (IPs, hostnames, emails, tokens, keys).
      # The private words list is deliberately NOT stored on GitHub; that check
      # runs locally in the git hooks before anything is pushed.
      - name: Scan all files for leak patterns
        run: python3 scripts/privacy_scan.py --all
      - name: Scan commit messages for leak patterns
        run: |
          git log --format=%B -n 50 > /tmp/messages.txt
          python3 scripts/privacy_scan.py --message /tmp/messages.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_models.py
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: [privacy, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
