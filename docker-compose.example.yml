# Example only. Copy to docker-compose.yml (git-ignored) and fill in your values.
services:
  voice-match:
    image: ghcr.io/loafwatch/voice-match:latest
    container_name: voice-match
    restart: unless-stopped
    ports:
      - "10310:10310"
      - "10311:10311"   # enrolment control API (only if VM_CONTROL_TOKEN is set)
    volumes:
      - /path/to/appdata/voice-match:/data
    environment:
      # Your existing faster-whisper Wyoming server
      VM_UPSTREAM_URI: tcp://faster-whisper:10300
      # Speaker recognition: voiceprints are kept in this folder
      VM_DATA_DIR: /data
      # Enrolment control API (called by Home Assistant)
      # VM_CONTROL_TOKEN: "<long random string>"
      # VM_LOG_TRANSCRIPTS: "false"   # keep off unless debugging
      # VM_DEBUG: "false"
